name: Release host tools
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cc -std=c11 -Wall -Wextra -Werror -pedantic build.c -o build
      - run: ./build package
      - name: Publish experimental host tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          out/release/p80h out/release/source.tar out/release/SHA256SUMS
          out/release/LICENSE out/release/NOTICE out/release/BUILD.txt
          out/release/REVISION out/release/TOOLCHAIN.txt
          --prerelease --title "P80h $GITHUB_REF_NAME — host tools"
          --notes "Experimental C host tools. Not tablet firmware. See BUILD.txt and SHA256SUMS."
