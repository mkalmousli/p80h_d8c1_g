name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap C build entry point
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic build.c -o build
      - name: Build and package host tools
        run: ./build package
      - uses: actions/upload-artifact@v4
        with:
          name: p80h-tools-${{ github.sha }}
          path: out/release/
          if-no-files-found: error
